<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Chambers</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

<div id="welcome">

    <div class="welcome-card">

        <h1>Echo Chambers</h1>

        <p class="artist">by Ragitha</p>

        <img id="cover" src="images/cover.jpeg" alt="Album Cover">

        <div class="message">

            <p class="home">Home isn't a place.</p>

            <p>
                For the days you miss me,<br>
                the days you don't,<br>
                and every day in between.
            </p>

            <div class="heart">🤍</div>

            <div class="kit">
                Emergency Best Friend Kit<br>
                <span>Use whenever required.</span>
            </div>

        </div>

        <button id="enterBtn">Open the album</button>

    </div>

</div>



    <div id="player" class="hidden">

        <h2>Echo Chambers</h2>

        <p class="artist">by Ragitha</p>

        <img id="coverPlayer" src="images/cover.jpeg" alt="Album Cover">

        <h3 id="trackTitle">Helloooo</h3>

        <audio id="audioPlayer"></audio>

        <input type="range" id="progress" value="0" min="0" max="100">

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <div id="playlist"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
