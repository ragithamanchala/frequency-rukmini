<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Chambers</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div id="welcome">

        <h1>Echo Chambers</h1>

        <p class="artist">by Ragitha</p>

        <img id="cover" src="images/cover.jpeg" alt="Album Cover">

        <div class="message">
            <p><strong>Home isn't a place.</strong></p>

            <p>
                For the days you miss me,<br>
                the days you don't,<br>
                and every day in between.
            </p>

            <p>🤍</p>

            <p><strong>Emergency Best Friend Kit.</strong><br>
            Use whenever required.</p>
        </div>

        <button id="enterBtn">▶ Press Play</button>

    </div>



    <div id="player" class="hidden">

        <h2>Echo Chambers</h2>

        <p class="artist">by Ragitha</p>

        <img id="coverPlayer" src="images/cover.jpeg" alt="Album Cover">

        <h3 id="trackTitle">Helloooo</h3>

        <audio id="audioPlayer"></audio>

        <input type="range" id="progress" value="0" min="0" max="100">

        <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prev">⏮</button>
            <button id="play">▶</button>
            <button id="next">⏭</button>
        </div>

        <div id="playlist"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
